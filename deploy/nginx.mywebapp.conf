server {
    listen 80;
    listen [::]:80;
    server_name mywebapp.id.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/xuannhashop-acme;
    }
    location / { return 301 https://mywebapp.id.vn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mywebapp.id.vn;
    ssl_certificate /etc/letsencrypt/live/mywebapp.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mywebapp.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:XuanNhaTLS:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 6m;
    server_tokens off;
    include /etc/nginx/snippets/xuannhashop-cloudflare-realip.conf;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
